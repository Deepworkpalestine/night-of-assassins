
name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project and build APK
        shell: bash
        run: |
          set -euo pipefail
          BACKUP="$RUNNER_TEMP/night-of-assassins-source"
          mkdir -p "$BACKUP"
          cp pubspec.yaml "$BACKUP/"
          cp -a lib assets "$BACKUP/"

          flutter create \
            --platforms=android \
            --org com.assassins.night \
            --project-name night_of_assassins \
            .

          cp "$BACKUP/pubspec.yaml" ./pubspec.yaml
          rm -rf lib assets
          cp -a "$BACKUP/lib" "$BACKUP/assets" .

          python3 - <<'PYCODE'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          content = content.replace(
              'android:label="night_of_assassins"',
              'android:label="ليلة المغتالين"',
          )
          manifest.write_text(content, encoding="utf-8")
          PYCODE

          flutter pub get
          flutter build apk --release

          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" "build/app/outputs/flutter-apk/Night-of-Assassins.apk"
          cd build/app/outputs/flutter-apk
          sha256sum Night-of-Assassins.apk > Night-of-Assassins.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: night-of-assassins-android-apk
          path: |
            build/app/outputs/flutter-apk/Night-of-Assassins.apk
            build/app/outputs/flutter-apk/Night-of-Assassins.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/Night-of-Assassins.apk
            build/app/outputs/flutter-apk/Night-of-Assassins.apk.sha256
