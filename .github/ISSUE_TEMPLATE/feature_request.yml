name: Feature request
description: Suggest an improvement or new game feature.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the player or maintainer need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Describe the solution you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: game-impact
    attributes:
      label: Gameplay and accessibility impact
      description: Explain how this affects game balance, local play, Arabic text, or accessibility.
